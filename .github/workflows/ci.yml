name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-2025
    steps:
      - name: Disable CRLF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - &install-tsf-llvm
        name: Install LLVM for TSF
        run: |
          # MSVC 14.52 requires Clang 22 or newer. The runner ships LLVM 20.
          $version = '22.1.8'
          $archive = Join-Path $env:RUNNER_TEMP "LLVM-$version-win64.exe"
          $llvmRoot = Join-Path $env:RUNNER_TEMP "llvm-$version"
          $sha256 = '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c'
          curl.exe --fail --location --retry 3 --connect-timeout 30 --max-time 300 `
            --silent --show-error --output $archive `
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'LLVM download failed.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $sha256) {
            throw 'LLVM installer checksum mismatch.'
          }
          7z.exe x -y "-o$llvmRoot" $archive 'bin/*' 'lib/clang/*'
          if ($LASTEXITCODE -ne 0) { throw 'LLVM extraction failed.' }
          & "$llvmRoot/bin/clang++.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'LLVM compiler check failed.' }
          Add-Content $env:GITHUB_ENV "FCITX5_CI_LLVM_ROOT=$llvmRoot"

      - name: Install Core dependencies
        run: |
          C:/msys64/usr/bin/pacman -Syu --noconfirm
          C:/msys64/usr/bin/pacman -S --noconfirm `
            mingw-w64-clang-x86_64-clang `
            mingw-w64-clang-x86_64-cmake `
            mingw-w64-clang-x86_64-ninja `
            mingw-w64-clang-x86_64-pkgconf `
            mingw-w64-clang-x86_64-gettext-tools `
            mingw-w64-clang-x86_64-extra-cmake-modules `
            mingw-w64-clang-x86_64-dlfcn `
            mingw-w64-clang-x86_64-libuv `
            mingw-w64-clang-x86_64-boost `
            mingw-w64-clang-x86_64-zstd `
            mingw-w64-clang-x86_64-glib2 `
            mingw-w64-clang-x86_64-db `
            mingw-w64-clang-x86_64-librime `
            mingw-w64-clang-x86_64-librime-data
          Add-Content $env:GITHUB_PATH 'C:/msys64/clang64/bin'

      - name: Read locked data metadata
        id: data-lock
        shell: pwsh
        run: |
          $lock = Get-Content cmake/pinyin-lock.json -Raw | ConvertFrom-Json
          $mozcKey = if ($lock.mozcData.PSObject.Properties['sha256'] -and $lock.mozcData.sha256) {
            $lock.mozcData.sha256.ToLowerInvariant()
          } else {
            $lock.repositories.'fcitx5-mozc'
          }
          "prebuilt_file=$($lock.prebuiltData.file)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prebuilt_sha256=$($lock.prebuiltData.sha256.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "mozc_file=$($lock.mozcData.file)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "mozc_key=$mozcKey" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache prebuilt Pinyin data
        uses: actions/cache@v6
        with:
          path: build/pinyin-data/${{ steps.data-lock.outputs.prebuilt_file }}
          key: pinyin-prebuilt-data-${{ steps.data-lock.outputs.prebuilt_sha256 }}

      - name: Cache Mozc data
        uses: actions/cache@v6
        with:
          path: build/mozc-data/${{ steps.data-lock.outputs.mozc_file }}
          key: mozc-data-${{ steps.data-lock.outputs.mozc_key }}

      - name: Build base Release runtime tree without tests
        run: |
          ./scripts/build-and-deploy.ps1 -Prefix ./dist/ci-runtime -BuildRoot ./build/ci-x64 `
            -LLVMRoot $env:FCITX5_CI_LLVM_ROOT -DataMode Prebuilt -ModernApps -SkipTests

      - name: Build full runtime with every plugin
        run: |
          Copy-Item -LiteralPath dist/ci-runtime -Destination dist/ci-runtime-full -Recurse
          ./scripts/build-plugins.ps1 -CorePrefix ./build/ci-x64/prefix -Prefix ./dist/ci-runtime-full -BuildRoot ./build/ci-x64/plugins

      - name: Verify bundled plugin discovery and commits
        run: |
          $sdk = (Resolve-Path build/ci-x64/prefix).Path.Replace('\', '/')
          $env:MSYS2_ROOT = 'C:/msys64'
          cmake -S tools/addon-probe -B build/ci-x64/addon-probe -G Ninja `
            "-DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/windows-addon-toolchain.cmake" `
            "-DFCITX5_WINDOWS_SDK=$sdk" "-DCMAKE_INSTALL_PREFIX=$sdk" `
            -DARCH=AMD64 -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER=C:/msys64/clang64/bin/clang++.exe `
            -DCMAKE_MAKE_PROGRAM=C:/msys64/clang64/bin/ninja.exe
          if ($LASTEXITCODE -ne 0) { throw 'Addon probe configuration failed.' }
          cmake --build build/ci-x64/addon-probe
          if ($LASTEXITCODE -ne 0) { throw 'Addon probe build failed.' }
          ctest --test-dir build/ci-x64/addon-probe --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Plugin directory tests failed.' }
          Copy-Item build/ci-x64/addon-probe/addon_probe.exe dist/ci-runtime-full/bin/
          Copy-Item build/ci-x64/addon-probe/addon_probe.exe dist/ci-runtime/bin/
          try {
            & ./dist/ci-runtime-full/bin/addon_probe.exe "$PWD/dist/ci-runtime-full" --default wenzhounese nyi
            if ($LASTEXITCODE -ne 0) { throw 'Bundled Wenzhounese probe failed.' }
            & ./dist/ci-runtime/bin/addon_probe.exe "$PWD/dist/ci-runtime" "$PWD/dist/ci-runtime/plugins" wenzhounese --absent
            if ($LASTEXITCODE -ne 0) { throw 'Base runtime unexpectedly contains Wenzhounese.' }
            foreach ($sample in @(@('wubi98', 'wq'), @('cangjie5', 'a'), @('jyutping-table', 'm'))) {
              & ./dist/ci-runtime-full/bin/addon_probe.exe "$PWD/dist/ci-runtime-full" --default $sample[0] $sample[1]
              if ($LASTEXITCODE -ne 0) { throw "Bundled table-extra probe failed: $($sample[0])" }
              & ./dist/ci-runtime/bin/addon_probe.exe "$PWD/dist/ci-runtime" --default $sample[0] --absent
              if ($LASTEXITCODE -ne 0) { throw "Base runtime unexpectedly contains table-extra: $($sample[0])" }
            }
            & ./dist/ci-runtime-full/bin/addon_probe.exe "$PWD/dist/ci-runtime-full" --default zhuyin 'su3' --preedit
            if ($LASTEXITCODE -ne 0) { throw 'Bundled Zhuyin probe failed.' }
            & ./dist/ci-runtime/bin/addon_probe.exe "$PWD/dist/ci-runtime" --default zhuyin --absent
            if ($LASTEXITCODE -ne 0) { throw 'Base runtime unexpectedly contains Zhuyin.' }
            & ./dist/ci-runtime-full/bin/addon_probe.exe "$PWD/dist/ci-runtime-full" --default mozc nihon --preedit
            if ($LASTEXITCODE -ne 0) { throw 'Bundled Mozc probe failed.' }
            & ./dist/ci-runtime/bin/addon_probe.exe "$PWD/dist/ci-runtime" --default mozc --absent
            if ($LASTEXITCODE -ne 0) { throw 'Base runtime unexpectedly contains Mozc.' }
            $env:PATH = "$PWD/dist/ci-runtime-full/bin;$PWD/dist/ci-runtime-full/plugins/fcitx5-zhuyin/bin;$env:PATH"
            & ./build/ci-x64/plugins/zhuyin-deps/zhuyin_model_probe.exe "$PWD/dist/ci-runtime-full/plugins/fcitx5-zhuyin/share/fcitx5/zhuyin"
            if ($LASTEXITCODE -ne 0) { throw 'Zhuyin model save/reload probe failed.' }
          } finally { Remove-Item -LiteralPath dist/ci-runtime-full/bin/addon_probe.exe, dist/ci-runtime/bin/addon_probe.exe }

      - name: Prepare portable TSF tests and probes
        run: |
          $build = (Resolve-Path build/ci-x64/tsf).Path.Replace('\', '/')
          $manifest = & ctest --test-dir $build --show-only=json-v1
          if ($LASTEXITCODE -ne 0) { throw 'CTest enumeration failed.' }
          $tests = ($manifest | Out-String | ConvertFrom-Json).tests
          if (!$tests.Count) { throw 'No default TSF tests were found.' }
          $bundle = 'build/ci-x64/test-bundle'
          New-Item -ItemType Directory -Force "$bundle/tests", "$bundle/dll", "$bundle/setup" | Out-Null
          Copy-Item "$build/tests/*.exe" "$bundle/tests"
          Copy-Item "$build/tests/*.dll", "$build/tests/check-tsf-runtime.ps1", "$build/tests/pe-machine.ps1", "$build/tests/test_runtime_audit.ps1", "$build/tests/test_sandboxie_template.ps1", "$build/tests/sandboxie-template.ps1" "$bundle/tests"
          Copy-Item "$build/share" "$bundle/share" -Recurse
          Copy-Item "$build/dll/fcitx5-x86_64.dll", "$build/dll/penguin.ico" "$bundle/dll"
          Copy-Item "$build/setup/Fcitx5SetupHelper.exe", "$build/setup/Fcitx5Upgrade.exe" "$bundle/setup"
          function Convert-TestArgument([string]$Value) {
            $value = $Value.Replace('\', '/')
            if ($value.StartsWith("$build/", [StringComparison]::OrdinalIgnoreCase)) {
              return @{ path = $value.Substring($build.Length + 1) }
            } elseif ($value -ieq "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe".Replace('\', '/')) {
              return @{ value = 'powershell.exe' }
            } elseif ([IO.Path]::IsPathRooted($value)) {
              throw "Test argument is outside the TSF build: $Value"
            }
            return @{ value = $Value }
          }
          $registration = foreach ($test in $tests) {
            if (@($test.properties | Where-Object name -notin 'WORKING_DIRECTORY', 'SKIP_RETURN_CODE', 'TIMEOUT').Count) {
              throw "Unsupported portable test properties: $($test.name)"
            }
            @{
              name = $test.name
              command = @($test.command | ForEach-Object { Convert-TestArgument $_ })
              workingDirectory = Convert-TestArgument ($test.properties | Where-Object name -eq 'WORKING_DIRECTORY').value
              properties = @($test.properties | Where-Object name -in 'SKIP_RETURN_CODE', 'TIMEOUT')
            }
          }
          ConvertTo-Json -InputObject @($registration) -Depth 5 | Set-Content "$bundle/tests.json" -Encoding utf8

      - name: Upload base runtime tree
        uses: actions/upload-artifact@v7
        with:
          name: Fcitx5-runtime-base-x64
          path: dist/ci-runtime/
          if-no-files-found: error

      - name: Upload full runtime tree
        uses: actions/upload-artifact@v7
        with:
          name: Fcitx5-runtime-full-x64
          path: dist/ci-runtime-full/
          if-no-files-found: error

      - name: Upload portable TSF tests and probes
        uses: actions/upload-artifact@v7
        with:
          name: Fcitx5-tests-x64
          path: build/ci-x64/test-bundle/
          if-no-files-found: error

      - name: Upload settings application
        uses: actions/upload-artifact@v7
        with:
          name: Fcitx5-settings-x64
          path: dist/ci-runtime/settings/
          if-no-files-found: error

  test-x64:
    needs: build-x64
    runs-on: windows-2025
    steps:
      - name: Disable CRLF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - name: Download shared runtime tree
        uses: actions/download-artifact@v8
        with:
          name: Fcitx5-runtime-base-x64
          path: dist/ci-runtime

      - name: Download portable TSF tests and probes
        uses: actions/download-artifact@v8
        with:
          name: Fcitx5-tests-x64
          path: build/ci-tests

      - name: Restore portable CTest registration
        run: |
          $bundle = (Resolve-Path build/ci-tests).Path.Replace('\', '/')
          $tests = Get-Content "$bundle/tests.json" -Raw | ConvertFrom-Json
          if (!$tests.Count) { throw 'No portable TSF tests were found.' }
          function Format-TestArgument($Argument) {
            $value = if ($Argument.path) { "$bundle/$($Argument.path)" } else { $Argument.value }
            return '"' + $value.Replace('\', '/').Replace('$', '\$').Replace('"', '\"') + '"'
          }
          $registration = foreach ($test in $tests) {
            $name = Format-TestArgument @{ value = $test.name }
            $arguments = @($test.command | ForEach-Object { Format-TestArgument $_ })
            'add_test(' + $name + ' ' + ($arguments -join ' ') + ')'
            'set_tests_properties(' + $name + ' PROPERTIES WORKING_DIRECTORY ' + (Format-TestArgument $test.workingDirectory) + ')'
            foreach ($property in $test.properties) {
              $propertyName = Format-TestArgument @{ value = $property.name }
              $propertyValue = Format-TestArgument @{ value = [string]$property.value }
              'set_tests_properties(' + $name + ' PROPERTIES ' + $propertyName + ' ' + $propertyValue + ')'
            }
          }
          $registration | Set-Content "$bundle/CTestTestfile.cmake" -Encoding utf8

      - name: Test unified build script
        run: ./scripts/test-build-and-deploy.ps1

      - name: Test automatic plugin builds
        run: ./scripts/test-build-plugins.ps1

      - name: Test installed TSF registration checks without system changes
        run: ./scripts/test-installer-registration.ps1

      - name: Check generated icon against the existing checksum
        run: |
          $expected = ((Get-Content win32/checksum -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash build/ci-tests/dll/penguin.ico -Algorithm MD5).Hash
          if ($actual -ne $expected) { throw 'Generated icon checksum mismatch.' }

      - name: Verify real Pinyin and unregistered TSF text contexts
        run: ./scripts/test-pinyin.ps1 -Prefix ./dist/ci-runtime -TsfBuild ./build/ci-tests

      - name: Verify input method selection, settings and real Wubi commits
        run: ./scripts/test-inputmethods.ps1 -Prefix ./dist/ci-runtime -TsfBuild ./build/ci-tests

      - name: Verify relocated engine translations in Chinese and English
        run: ./scripts/test-engine-localization.ps1 -Prefix ./dist/ci-runtime -TsfBuild ./build/ci-tests

      - name: Verify third-party dictionary loading
        run: ./scripts/test-dictionaries.ps1 -Prefix ./dist/ci-runtime -TsfBuild ./build/ci-tests

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pinyin-test-logs
          path: |
            build/pinyin-test/*.log
            build/dictionaries-test/*.log
            build/inputmethods-test/**/*.log
            build/engine-localization-test/**/*.log
            build/ci-tests/Testing/Temporary/*.log

  test-x86:
    needs: build-x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - *install-tsf-llvm
      - name: Install portable headers and build tools
        run: |
          C:/msys64/usr/bin/pacman -Syu --noconfirm
          C:/msys64/usr/bin/pacman -S --noconfirm mingw-w64-clang-x86_64-boost mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-gettext-tools
          Add-Content $env:GITHUB_PATH 'C:/msys64/clang64/bin'
      - name: Build and test independent x86 TSF
        run: |
          ./scripts/build-tsf.ps1 -Architecture x86 -BuildRoot ./build/ci-x86 `
            -LLVMRoot $env:FCITX5_CI_LLVM_ROOT -ModernApps
      - uses: actions/download-artifact@v8
        with:
          name: Fcitx5-runtime-base-x64
          path: dist/ci-runtime
      - uses: actions/download-artifact@v8
        with:
          name: Fcitx5-tests-x64
          path: build/ci-x64-tests
      - name: Verify x86 Pinyin, TSF and concurrent x86/x64 clients
        run: ./scripts/test-pinyin.ps1 -Prefix ./dist/ci-runtime -TsfBuild ./build/ci-x86 -Architecture x86 -PeerTsfBuild ./build/ci-x64-tests
      - name: Verify dual-architecture deployment and single-DLL locks
        run: ./scripts/test-deploy-tsf.ps1 -TsfBuild ./build/ci-x64-tests -TsfX86Build ./build/ci-x86
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: x86-tsf-test-logs
          path: |
            build/ci-x86/Testing/Temporary/*.log
            build/pinyin-test/*.log

  build-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - name: Disable CRLF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up native MSYS2 CLANGARM64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          release: false
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-gettext-tools
            mingw-w64-clang-aarch64-extra-cmake-modules
            mingw-w64-clang-aarch64-dlfcn
            mingw-w64-clang-aarch64-libuv
            mingw-w64-clang-aarch64-boost
            mingw-w64-clang-aarch64-zstd
            mingw-w64-clang-aarch64-glib2
            mingw-w64-clang-aarch64-db
            mingw-w64-clang-aarch64-imagemagick
            mingw-w64-clang-aarch64-librsvg

      - name: Add ARM64 MSYS2 tools to PATH
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          if (!(Test-Path "$env:MSYS2_LOCATION/clangarm64/bin/clang++.exe")) {
            throw 'MSYS2 CLANGARM64 compiler was not installed.'
          }
          "$env:MSYS2_LOCATION/clangarm64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MSYS2_ROOT=$env:MSYS2_LOCATION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify native ARM64 SVG tooling
        shell: pwsh
        run: |
          $magick = Join-Path $env:MSYS2_ROOT 'clangarm64/bin/magick.exe'
          $rsvg = Join-Path $env:MSYS2_ROOT 'clangarm64/bin/rsvg-convert.exe'
          foreach ($tool in @($magick, $rsvg)) {
            if (!(Test-Path -LiteralPath $tool -PathType Leaf)) {
              throw "Required native ARM64 SVG tool is missing: $tool"
            }
          }
          . ./win32/scripts/pe-machine.ps1
          Assert-PeMachine $magick arm64
          Assert-PeMachine $rsvg arm64
          Write-Host "ImageMagick: $magick"
          Write-Host "librsvg: $rsvg"
          $icon = Join-Path $env:RUNNER_TEMP 'fcitx5-penguin-arm64.ico'
          & $magick -background none "$PWD/win32/assets/penguin.svg" $icon
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $icon -PathType Leaf)) {
            throw 'ImageMagick could not convert the TSF SVG icon using the native ARM64 librsvg delegate.'
          }
          Remove-Item -LiteralPath $icon -Force

      - name: Read locked Pinyin data metadata
        id: arm64-data-lock
        shell: pwsh
        run: |
          $lock = Get-Content cmake/pinyin-lock.json -Raw | ConvertFrom-Json
          "prebuilt_file=$($lock.prebuiltData.file)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prebuilt_sha256=$($lock.prebuiltData.sha256.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache ARM64 Pinyin data
        uses: actions/cache@v6
        with:
          path: build/pinyin-data/${{ steps.arm64-data-lock.outputs.prebuilt_file }}
          key: pinyin-prebuilt-data-arm64-${{ steps.arm64-data-lock.outputs.prebuilt_sha256 }}

      - name: Build native ARM64 Pinyin Core
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./scripts/build-pinyin.ps1 -Architecture ARM64 -MSYS2Root $env:MSYS2_ROOT `
            -Prefix ./dist/ci-arm64 -BuildRoot ./build/ci-arm64/core `
            -DataMode Prebuilt -Jobs 4

      - name: Build native ARM64 TSF
        shell: pwsh
        run: |
          ./scripts/build-tsf.ps1 -Architecture arm64 -BuildRoot ./build/ci-arm64/tsf `
            -LLVMRoot 'C:/Program Files/LLVM' -BoostHeaders "$env:MSYS2_ROOT/clangarm64/include" `
            -ModernApps -Jobs 4

      - name: Build native ARM64 WinUI Settings
        shell: pwsh
        run: |
          # The ARM64 i18n static library is built with the runner's VS 18
          # MSVC 14.52 toolset (v145). Keep the WinUI link step on that same
          # STL/CRT toolset instead of the project file's legacy v143 default.
          ./scripts/build-settings.ps1 -Architecture ARM64 -PlatformToolset v145 `
            -Prefix ./dist/ci-arm64 -BuildRoot ./build/ci-arm64/settings `
            -BoostSource ./build/ci-arm64/tsf/_deps/native_boost-src `
            -BoostHeaders "$env:MSYS2_ROOT/clangarm64/include"

      - name: Verify ARM64 PE images and stage TSF helpers
        shell: pwsh
        run: |
          . ./win32/scripts/pe-machine.ps1
          $images = Get-ChildItem dist/ci-arm64 -Recurse -File |
            Where-Object Extension -in '.dll', '.exe'
          if (!$images.Count) { throw 'No ARM64 runtime images were produced.' }
          foreach ($image in $images) {
            Assert-PeMachine $image.FullName arm64
          }
          Assert-PeMachine build/ci-arm64/tsf/dll/fcitx5-arm64.dll arm64
          Assert-PeMachine build/ci-arm64/tsf/setup/Fcitx5SetupHelper.exe arm64
          Assert-PeMachine build/ci-arm64/tsf/setup/Fcitx5Upgrade.exe arm64
          New-Item -ItemType Directory -Force dist/ci-arm64/tsf, dist/ci-arm64/setup | Out-Null
          Copy-Item build/ci-arm64/tsf/dll/fcitx5-arm64.dll dist/ci-arm64/tsf/
          Copy-Item build/ci-arm64/tsf/setup/Fcitx5SetupHelper.exe, build/ci-arm64/tsf/setup/Fcitx5Upgrade.exe dist/ci-arm64/setup/
          $testBundle = 'build/ci-arm64/test-bundle'
          New-Item -ItemType Directory -Force "$testBundle/tests", "$testBundle/dll" | Out-Null
          $testImages = @(Get-ChildItem build/ci-arm64/tsf/tests -File |
            Where-Object Extension -in '.exe', '.dll')
          foreach ($name in @('ipc_probe.exe', 'tsf_probe.exe', 'settings_probe.exe',
              'inputmethods_probe.exe', 'dictionaries_probe.exe', 'test_tsf_runtime_host.exe')) {
            if (!(Test-Path -LiteralPath "build/ci-arm64/tsf/tests/$name" -PathType Leaf)) {
              throw "Required ARM64 integration probe is missing: $name"
            }
          }
          foreach ($image in $testImages) {
            Assert-PeMachine $image.FullName arm64
            Copy-Item -LiteralPath $image.FullName -Destination "$testBundle/tests/"
          }
          Copy-Item build/ci-arm64/tsf/dll/fcitx5-arm64.dll "$testBundle/dll/"

      - name: Upload ARM64 integration test bundle
        uses: actions/upload-artifact@v7
        with:
          name: Fcitx5-tests-arm64
          path: build/ci-arm64/test-bundle/
          if-no-files-found: error

      - name: Upload ARM64 runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: Fcitx5-runtime-arm64
          path: dist/ci-arm64/
          if-no-files-found: error

      - name: Upload ARM64 build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-build-logs
          if-no-files-found: warn
          path: |
            build/ci-arm64/tsf/Testing/Temporary/*.log
            build/ci-arm64/tsf/CMakeFiles/CMakeError.log
            build/ci-arm64/tsf/CMakeFiles/CMakeOutput.log

  test-arm64:
    needs: build-arm64
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - name: Disable CRLF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - name: Download native ARM64 runtime
        uses: actions/download-artifact@v8
        with:
          name: Fcitx5-runtime-arm64
          path: dist/ci-arm64

      - name: Download native ARM64 integration probes
        uses: actions/download-artifact@v8
        with:
          name: Fcitx5-tests-arm64
          path: build/ci-arm64-tests

      - name: Verify native ARM64 test images
        shell: pwsh
        run: |
          . ./win32/scripts/pe-machine.ps1
          foreach ($image in Get-ChildItem build/ci-arm64-tests/tests -File |
              Where-Object Extension -in '.exe', '.dll') {
            Assert-PeMachine $image.FullName arm64
          }
          Assert-PeMachine build/ci-arm64-tests/dll/fcitx5-arm64.dll arm64
          Assert-PeMachine dist/ci-arm64/bin/Fcitx5.exe arm64
          Assert-PeMachine dist/ci-arm64/settings/Fcitx5Settings.exe arm64

      - name: Verify native ARM64 Pinyin, TSF and IPC
        run: |
          ./scripts/test-pinyin.ps1 -Prefix ./dist/ci-arm64 -TsfBuild ./build/ci-arm64-tests `
            -Architecture arm64 -SkipCTest

      - name: Verify ARM64 input method selection, settings and commits
        run: ./scripts/test-inputmethods.ps1 -Prefix ./dist/ci-arm64 -TsfBuild ./build/ci-arm64-tests -Architecture arm64

      - name: Verify ARM64 engine translations in Chinese and English
        run: ./scripts/test-engine-localization.ps1 -Prefix ./dist/ci-arm64 -TsfBuild ./build/ci-arm64-tests

      - name: Verify ARM64 third-party dictionary loading
        run: ./scripts/test-dictionaries.ps1 -Prefix ./dist/ci-arm64 -TsfBuild ./build/ci-arm64-tests

      - name: Upload ARM64 integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-test-logs
          if-no-files-found: warn
          path: |
            build/pinyin-test/*.log
            build/dictionaries-test/*.log
            build/inputmethods-test/**/*.log
            build/engine-localization-test/**/*.log

  package-installer-x64:
    needs: build-x64
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        edition: [base, full]
        runtime: [runtime, no-runtime]
    steps:
      - name: Disable CRLF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download shared runtime tree
        uses: actions/download-artifact@v8
        with:
          name: Fcitx5-runtime-${{ matrix.edition }}-x64
          path: dist/installer-stage

      - name: Install Inno Setup compiler
        run: winget install --id JRSoftware.InnoSetup.7 -e --silent --accept-source-agreements --accept-package-agreements

      - name: Check Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:/Program Files (x86)/Inno Setup 7', 'C:/Program Files/Inno Setup 7', "$env:LOCALAPPDATA/Programs/Inno Setup 7" -Filter ISCC.exe -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$iscc) { throw 'ISCC.exe was not installed.' }
          $version = (& $iscc.FullName --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^7\.\d+\.\d+(?:\..*)?(?:-.*)?$') { throw "Inno Setup 7 is required, got: $version" }
          Write-Output "Using $($iscc.FullName)"
          Write-Output "Inno Setup version: $version"
          Get-AuthenticodeSignature $iscc.FullName | Format-List Status,SignerCertificate
          "FCITX5_ISCC_PATH=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download locked runtime dependencies
        if: matrix.runtime == 'runtime'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/installer-deps | Out-Null
          Invoke-WebRequest -Uri 'https://download.visualstudio.microsoft.com/download/pr/bd1c8d9d-ba95-4eee-bc6e-df1fcc876373/CC0FF0EB1DC3F5188AE6300FAEF32BF5BEEBA4BDD6E8E445A9184072096B713B/VC_redist.x64.exe' -OutFile build/installer-deps/vc_redist.x64.exe
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/8eb5473d-5663-4337-a1ca-aa5030b9b194/WindowsAppRuntimeInstall-x64.exe' -OutFile build/installer-deps/WindowsAppRuntimeInstall-x64.exe
          if ((Get-FileHash build/installer-deps/vc_redist.x64.exe -Algorithm SHA256).Hash -ne 'CC0FF0EB1DC3F5188AE6300FAEF32BF5BEEBA4BDD6E8E445A9184072096B713B') { throw 'VC++ runtime hash mismatch.' }
          if ((Get-FileHash build/installer-deps/WindowsAppRuntimeInstall-x64.exe -Algorithm SHA256).Hash -ne '7C092E85FC1E3E7CB2BD7D549AAAB03CAF924131F15D9B20B1855457A98205AA') { throw 'Windows App Runtime hash mismatch.' }

      - name: Test installer packaging script
        run: ./scripts/test-build-installer.ps1

      - name: Test installer wizard without system changes
        run: |
          ./scripts/test-installer-wizard.ps1 -IsccPath $env:FCITX5_ISCC_PATH
          ./scripts/test-installer-restart.ps1 -IsccPath $env:FCITX5_ISCC_PATH

      - name: Build installer
        run: |
          $skipRuntimes = '${{ matrix.runtime }}' -eq 'no-runtime'
          $suffix = if ($skipRuntimes) { '-no-runtime' } else { '' }
          $package = 'Fcitx5-${{ github.run_number }}-${{ matrix.edition }}-x64' + $suffix + '-setup'
          ./scripts/build-installer.ps1 -IsccPath $env:FCITX5_ISCC_PATH -Prefix ./dist/installer-stage -Dependencies ./build/installer-deps -Output ./dist/installer -PackageVersion 0.1.${{ github.run_number }}.0 -PackageName $package -SkipRuntimes:$skipRuntimes
          "FCITX5_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify installer metadata
        run: |
          Get-ChildItem dist/installer
          foreach ($package in @($env:FCITX5_PACKAGE)) {
            foreach ($suffix in @('.exe', '.exe.sha256', '.manifest.txt')) {
              if (!(Test-Path -LiteralPath "dist/installer/$package$suffix" -PathType Leaf)) {
                throw "Installer output missing: $package$suffix"
              }
            }
          }
          $manifest = Get-Content -Raw "dist/installer/metadata/$env:FCITX5_PACKAGE.runtime.json" | ConvertFrom-Json
          $tableExtra = 'plugins/fcitx5-table-extra'
          $expected = @("$tableExtra/licenses/LICENSES/GPL-3.0-or-later.txt")
          foreach ($source in Get-ChildItem plugins/fcitx5-table-extra/tables -Filter '*.conf.in' -File) {
            $method = $source.Name -replace '\.conf\.in$', ''
            $expected += "$tableExtra/share/fcitx5/inputmethod/$method.conf"
            $expected += "$tableExtra/share/fcitx5/table/$method.main.dict"
          }
          $zhuyin = 'plugins/fcitx5-zhuyin'
          $expected += @("$zhuyin/lib/fcitx5/zhuyin.dll", "$zhuyin/bin/libzhuyin.dll",
            "$zhuyin/share/fcitx5/addon/zhuyin.conf", "$zhuyin/share/fcitx5/inputmethod/zhuyin.conf",
            "$zhuyin/licenses/libpinyin/COPYING", "$zhuyin/licenses/LICENSES/GPL-2.0-or-later.txt",
            "$zhuyin/licenses/glib2/COPYING", "$zhuyin/licenses/db/LICENSE")
          foreach ($name in @('bigram.db', 'gb_char.bin', 'gbk_char.bin', 'merged.bin',
              'phrase_index.bin', 'pinyin_index.bin', 'addon_phrase_index.bin', 'addon_pinyin_index.bin',
              'table.conf', 'easysymbols.txt')) {
            $expected += "$zhuyin/share/fcitx5/zhuyin/$name"
          }
          $mozc = 'plugins/fcitx5-mozc'
          $expected += @("$mozc/lib/fcitx5/libmozc.dll",
            "$mozc/share/fcitx5/addon/mozc.conf", "$mozc/share/fcitx5/inputmethod/mozc.conf",
            "$mozc/licenses/LICENSE", "$mozc/licenses/mozc/LICENSE",
            "$mozc/licenses/abseil-cpp/LICENSE", "$mozc/licenses/protobuf/LICENSE",
            "$mozc/share/locale/ja/LC_MESSAGES/fcitx5-mozc.mo",
            "$mozc/share/locale/zh_CN/LC_MESSAGES/fcitx5-mozc.mo",
            "$mozc/share/locale/zh_TW/LC_MESSAGES/fcitx5-mozc.mo")
          foreach ($path in $expected) {
            $count = @($manifest.files | Where-Object path -eq $path).Count
            $required = if ('${{ matrix.edition }}' -eq 'full') { 1 } else { 0 }
            if ($count -ne $required) { throw "Incorrect plugin installer payload: $path" }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Fcitx5-installer-${{ matrix.edition }}-x64-${{ matrix.runtime }}
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
            dist/installer/*.txt

  package-installer-arm64:
    needs: build-arm64
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [runtime, no-runtime]
    steps:
      - name: Disable CRLF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download native ARM64 runtime tree
        uses: actions/download-artifact@v8
        with:
          name: Fcitx5-runtime-arm64
          path: dist/installer-stage

      - name: Install Inno Setup compiler
        run: winget install --id JRSoftware.InnoSetup.7 -e --silent --accept-source-agreements --accept-package-agreements

      - name: Check Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:/Program Files (x86)/Inno Setup 7', 'C:/Program Files/Inno Setup 7', "$env:LOCALAPPDATA/Programs/Inno Setup 7" -Filter ISCC.exe -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$iscc) { throw 'ISCC.exe was not installed.' }
          $version = (& $iscc.FullName --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^7\.\d+\.\d+(?:\..*)?(?:-.*)?$') { throw "Inno Setup 7 is required, got: $version" }
          Write-Output "Using $($iscc.FullName)"
          Write-Output "Inno Setup version: $version"
          Get-AuthenticodeSignature $iscc.FullName | Format-List Status,SignerCertificate
          "FCITX5_ISCC_PATH=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify ARM64 runtime dependencies
        if: matrix.runtime == 'runtime'
        shell: pwsh
        run: |
          $lock = Get-Content cmake/installer-lock.json -Raw | ConvertFrom-Json
          $vc = $lock.vcRuntimeArm64
          $appRuntime = $lock.windowsAppRuntimeArm64
          New-Item -ItemType Directory -Force build/installer-deps | Out-Null
          Invoke-WebRequest -Uri $vc.url -OutFile "build/installer-deps/$($vc.file)"
          Invoke-WebRequest -Uri $appRuntime.url -OutFile "build/installer-deps/$($appRuntime.file)"
          if ((Get-FileHash "build/installer-deps/$($vc.file)" -Algorithm SHA256).Hash -ne $vc.sha256) {
            throw 'ARM64 VC++ runtime hash mismatch.'
          }
          . ./win32/scripts/pe-machine.ps1
          # The ARM64 VC++ redistributable is shipped as an x86 bootstrapper;
          # it installs the ARM64 runtime on Windows on Arm.
          Assert-PeMachine "build/installer-deps/$($vc.file)" x86
          # The Windows App Runtime installer is Microsoft-signed and versioned
          # for ARM64; its bootstrapper PE architecture is not the app payload ABI.
          foreach ($file in @($vc.file, $appRuntime.file)) {
            $signature = Get-AuthenticodeSignature "build/installer-deps/$file"
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation') {
              throw "ARM64 runtime dependency has no valid Microsoft signature: $file ($($signature.Status))"
            }
          }
          Write-Output "Windows App Runtime ARM64 SHA256: $((Get-FileHash "build/installer-deps/$($appRuntime.file)" -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Test architecture-aware installer packaging
        run: ./scripts/test-build-installer.ps1

      - name: Build ARM64 installer
        shell: pwsh
        run: |
          $skipRuntimes = '${{ matrix.runtime }}' -eq 'no-runtime'
          $suffix = if ($skipRuntimes) { '-no-runtime' } else { '' }
          $package = 'Fcitx5-${{ github.run_number }}-base-arm64' + $suffix + '-setup'
          ./scripts/build-installer.ps1 -Architecture arm64 -IsccPath $env:FCITX5_ISCC_PATH -Prefix ./dist/installer-stage -Dependencies ./build/installer-deps -Output ./dist/installer -PackageVersion 0.1.${{ github.run_number }}.0 -PackageName $package -SkipRuntimes:$skipRuntimes
          "FCITX5_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify ARM64 installer metadata and bootstrapper architecture
        shell: pwsh
        run: |
          . ./win32/scripts/pe-machine.ps1
          $installer = "dist/installer/$env:FCITX5_PACKAGE.exe"
          foreach ($suffix in @('.exe', '.exe.sha256', '.manifest.txt')) {
            if (!(Test-Path -LiteralPath "dist/installer/$env:FCITX5_PACKAGE$suffix" -PathType Leaf)) {
              throw "ARM64 installer output missing: $env:FCITX5_PACKAGE$suffix"
            }
          }
          # Inno's x86 Setup runs under WoA emulation; its installed payload is native ARM64.
          Assert-PeMachine $installer x86
          $manifest = Get-Content -Raw "dist/installer/metadata/$env:FCITX5_PACKAGE.runtime.json" | ConvertFrom-Json
          if ($manifest.architecture -ne 'arm64' -or
              @($manifest.files | Where-Object path -eq 'tsf/fcitx5-arm64.dll').Count -ne 1 -or
              @($manifest.files | Where-Object path -match 'fcitx5-x86_64|tsf/x86/').Count -ne 0) {
            throw 'ARM64 installer manifest contains the wrong TSF architecture.'
          }
          if ('${{ matrix.runtime }}' -eq 'runtime') {
            if (@($manifest.dependencies | Where-Object path -eq 'vc_redist.arm64.exe').Count -ne 1 -or
                @($manifest.dependencies | Where-Object path -eq 'WindowsAppRuntimeInstall-arm64.exe').Count -ne 1) {
              throw 'ARM64 installer is missing architecture-matched runtime dependencies.'
            }
          } elseif ($manifest.dependencies.Count -ne 0) {
            throw 'No-runtime ARM64 package unexpectedly contains runtime dependencies.'
          }

      - name: Upload ARM64 installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Fcitx5-installer-base-arm64-${{ matrix.runtime }}
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
            dist/installer/*.txt

  installer-smoke-x64:
    needs: package-installer-x64
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        edition: [base, full]
    steps:
      - name: Disable CRLF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: Fcitx5-installer-${{ matrix.edition }}-x64-no-runtime
          path: dist/installer

      - name: Run install and uninstall smoke test
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem dist/installer -Filter '*-x64-no-runtime-setup.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected exactly one no-runtime installer, found $($installer.Count)." }
          ./scripts/test-installer.ps1 -InstallerPath $installer[0].FullName -ModernApps

      - name: Upload installer smoke logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: installer-smoke-${{ matrix.edition }}-logs
          if-no-files-found: warn
          path: build/installer-smoke

  installer-smoke-arm64:
    needs: [package-installer-arm64, test-arm64]
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - name: Disable CRLF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - name: Download ARM64 no-runtime installer
        uses: actions/download-artifact@v8
        with:
          name: Fcitx5-installer-base-arm64-runtime
          path: dist/installer

      - name: Install ARM64 VC runtime for the native setup helper
        shell: pwsh
        run: |
          $lock = Get-Content cmake/installer-lock.json -Raw | ConvertFrom-Json
          $vc = $lock.vcRuntimeArm64
          $path = "build/installer-deps/$($vc.file)"
          New-Item -ItemType Directory -Force (Split-Path $path) | Out-Null
          Invoke-WebRequest -Uri $vc.url -OutFile $path
          if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $vc.sha256) { throw 'ARM64 VC++ runtime hash mismatch.' }
          . ./win32/scripts/pe-machine.ps1
          Assert-PeMachine $path x86
          $signature = Get-AuthenticodeSignature $path
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation') {
            throw "ARM64 VC++ runtime signature is invalid: $($signature.Status)"
          }
          $process = Start-Process -FilePath (Resolve-Path $path).Path -ArgumentList '/install /quiet /norestart' -Wait -PassThru
          if ($process.ExitCode -notin @(0, 1638, 3010)) { throw "ARM64 VC++ runtime installation failed: $($process.ExitCode)" }

      - name: Run ARM64 install and uninstall smoke test
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem dist/installer -Filter '*-base-arm64-setup.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected exactly one ARM64 runtime installer, found $($installer.Count)." }
          ./scripts/test-installer.ps1 -Architecture arm64 -InstallerPath $installer[0].FullName -ModernApps

      - name: Upload ARM64 installer smoke logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: installer-smoke-arm64-logs
          if-no-files-found: warn
          path: build/installer-smoke

  release:
    needs: [build-x64, test-x64, test-x86, build-arm64, test-arm64, package-installer-x64, installer-smoke-x64, package-installer-arm64, installer-smoke-arm64]
    if: ${{ github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '!release') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          pattern: Fcitx5-installer-*
          merge-multiple: true

      - name: Create Nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s failglob
          files=(
            Fcitx5-*-base-x64-setup.exe{,.sha256}
            Fcitx5-*-base-x64-no-runtime-setup.exe{,.sha256}
            Fcitx5-*-full-x64-setup.exe{,.sha256}
            Fcitx5-*-full-x64-no-runtime-setup.exe{,.sha256}
            Fcitx5-*-base-arm64-setup.exe{,.sha256}
            Fcitx5-*-base-arm64-no-runtime-setup.exe{,.sha256}
          )

          release_id=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq '.[] | select(.tag_name == "latest") | .id')
          tag_ref=$(gh api "repos/$GH_REPO/git/matching-refs/tags/latest" \
            --jq '.[] | select(.ref == "refs/tags/latest") | .ref')
          if [[ -n "$release_id" ]]; then
            gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
          fi
          if [[ -n "$tag_ref" ]]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
          fi
          gh release create latest "${files[@]}" --verify-tag \
            --title 'Nightly Build' --prerelease --generate-notes
